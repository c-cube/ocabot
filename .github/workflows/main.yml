name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ocaml-version: "5.1"
            container: ghcr.io/c-cube/c-cube-commmon/ci-5.1:latest
          - ocaml-version: "5.4"
            container: ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v6
      - run: opam pin calculon --dev -y -n
      - run: opam pin https://github.com/c-cube/irky.git -y -n
      - run: apt update && opam install -t ./ocabot.opam --deps-only
      - run: opam exec -- dune build '@install'
      - run: opam exec -- dune runtest --force

  format:
    name: format
    runs-on: ubuntu-latest
    container: ghcr.io/c-cube/c-cube-commmon/ci-doc-5.3:latest

    steps:
      - uses: actions/checkout@v6
      - run: opam exec -- make format-check

  docker:
    name: docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: c-cube/c-cube-common/.github/workflows/docker-publish.yml@170b6600d0c23345f76d93ddb123462f982f9f6c
